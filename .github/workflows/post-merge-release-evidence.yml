name: Post-Merge Release Evidence

on:
  workflow_run:
    workflows: [Post-Merge Distribution Integrity]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read
  statuses: write

jobs:
  reconcile:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    uses: djconnect-music-dj/djconnect-shared-workflows/.github/workflows/post-merge-release-evidence-487.yml@4559963eec59251278c7b0ae6418033d2de079f8
    with:
      policy_source_ref: 4877403ba6fc69881439e70d3048da13ecb5576b
      required_main_workflow: Post-Merge Distribution Integrity
      required_check_contexts: '["Trusted Delivery qualification / Qualify trusted delivery"]'
      repository_role: distribution
      distribution_evidence_artifact_name: platform-release-distribution-integrity
